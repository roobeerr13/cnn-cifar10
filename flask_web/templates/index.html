<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Imágenes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Clasificador de Imágenes CIFAR-10</h1>
        <div class="upload-container">
            <input type="file" id="file-input" accept="image/*">
            <label for="file-input" class="file-label">Seleccionar Imagen</label>
        </div>
        <div class="preview-container">
            <img id="preview-image" src="#" alt="Vista Previa">
        </div>
        <button id="predict-button">Clasificar</button>
        <div class="results-container">
            <h2>Resultados</h2>
            <div id="results"></div>
        </div>
        <div class="chart-container">
            <canvas id="accuracy-chart"></canvas>
            <canvas id="loss-chart"></canvas>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
