<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Imágenes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Clasificador de Imágenes CIFAR-10</h1>
        <div class="upload-container">
            <input type="file" id="file-input" accept="image/*">
            <label for="file-input" class="file-label">
                <i class="fas fa-paperclip"></i> Adjuntar Imagen
            </label>
        </div>
        <div class="preview-container">
            <img id="preview-image" src="#" alt="Vista Previa">
        </div>
        <button id="predict-button">Clasificar</button>
        <div class="results-container">
            <h2>Resultados</h2>
            <div id="results"></div>
        </div>
        <div class="charts-link-container">
            <a href="/charts" target="_blank" class="charts-link">Ver Gráficos de Entrenamiento</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
